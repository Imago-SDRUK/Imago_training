on:
  workflow_dispatch:
  push:
    branches: [main, auto_render]

name: Quarto Publish

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages:
            any::knitr
            any::rmarkdown
            any::tidyverse
            any::readxl
            any::sf
            any::reticulate
            any::tmap
            any::geojsonsf
            any::osmdata
            Chrisjb/basemapR
            any::viridis
            any::cowplot
            any::fs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          which python3
          python3 -m pip install jupyter
          python3 -m pip install numpy pandas geopandas \
            matplotlib seaborn \
            statsmodels scipy \
            requests

      - name: Configure reticulate to use system Python
        run: |
          PYTHON_PATH=$(which python3)
          echo "RETICULATE_PYTHON=${PYTHON_PATH}" >> $GITHUB_ENV
          echo "RETICULATE_PYTHON=${PYTHON_PATH}" >> ~/.Renviron
          echo "RETICULATE_PYTHON_FALLBACK=${PYTHON_PATH}" >> ~/.RenvironV

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
